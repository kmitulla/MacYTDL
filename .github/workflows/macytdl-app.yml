name: MacYTDL app (build, test, release DMG)

on:
  push:
    branches: [ "master", "claude/**" ]
    paths: [ "MacYTDL-App/**", ".github/workflows/macytdl-app.yml" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macytdl-app-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: "3.0.0"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: MacYTDL-App
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app || true
          swift --version
          sw_vers

      - name: Compile (fail fast)
        run: swift build -c release 2>&1 | tail -n 300

      - name: Check compile result
        run: swift build -c release

      - name: Tool cache key
        id: day
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache bundled tools
        uses: actions/cache@v4
        with:
          path: MacYTDL-App/vendor
          key: tools-${{ hashFiles('MacYTDL-App/scripts/fetch_tools.sh') }}-${{ steps.day.outputs.day }}

      - name: Fetch yt-dlp, FFmpeg, Deno
        run: |
          if [ ! -f vendor/Tools/manifest.json ]; then ./scripts/fetch_tools.sh vendor; fi
          cat vendor/Tools/manifest.json

      - name: Build MacYTDL.app (universal)
        run: BUILD=${{ github.run_number }} ./scripts/build_app.sh vendor

      - name: Screenshots (demo mode)
        if: always()
        continue-on-error: true
        run: ./scripts/screenshots.sh dist/MacYTDL.app "$RUNNER_TEMP/shots" de

      - name: Self-test (real downloads through the app engine)
        id: selftest
        run: |
          set -o pipefail
          dist/MacYTDL.app/Contents/MacOS/MacYTDL --selftest "$RUNNER_TEMP/selftest" 2>&1 | tee "$RUNNER_TEMP/selftest.log"

      - name: Create DMG
        run: ./scripts/make_dmg.sh

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MacYTDL-${{ env.VERSION }}-${{ github.run_number }}
          path: |
            MacYTDL-App/dist/MacYTDL.dmg
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/selftest.log
          if-no-files-found: ignore

      - name: Publish CI preview (screenshots + logs)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=ci-preview
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --target "$GITHUB_SHA" \
            --title "CI preview (screenshots)" --notes "Automatic screenshots and self-test logs from CI. Not a release."
          FILES=$(find "$RUNNER_TEMP/shots" "$RUNNER_TEMP/selftest.log" -type f -size +0 \( -name '*.png' -o -name '*.log' \) 2>/dev/null || true)
          [ -n "$FILES" ] && gh release upload "$TAG" $FILES --clobber

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          MANIFEST=$(cat vendor/Tools/manifest.json)
          cat > notes.md <<NOTES
          ## MacYTDL 2030 – Version $VERSION (Build ${{ github.run_number }})

          **Download:** [MacYTDL.dmg](https://github.com/${{ github.repository }}/releases/download/$TAG/MacYTDL.dmg)

          Native SwiftUI-App im Liquid-Glass-Design (macOS 26/27) mit Fluent-/Mica-Anmutung. Läuft auf macOS 14 Sonoma und neuer, Apple Silicon und Intel.

          ### Neu
          - Vorschau mit Titel, Thumbnail, Qualitäten und geschätzter Dateigröße vor dem Download
          - Smarte Befehle: „nur Audio als MP3 von 1:20 bis 3:00 ohne Sponsoren“ (mit Apple Intelligence, sonst Offline-Parser)
          - Warteschlange mit parallelen Downloads, Pause/Fortsetzen, automatischen Wiederholungen, Dock-Fortschritt
          - Bibliothek mit Suche, Quick Look, Teilen; YouTube-Suche direkt in der App
          - Abos: Kanäle & Playlists automatisch auf neue Videos prüfen
          - Clips (Zeitbereich), SponsorBlock, Untertitel, Cover/Metadaten/Kapitel einbetten, Apple-kompatibles MP4
          - Menüleisten-Symbol, ⇧⌘V-Sofortdownload, Drag & Drop, Browser-Lesezeichen, Dienste-Menü, macytdl:// URL-Schema
          - Verständliche Fehlerhilfe (z. B. Cookies bei „Sign in to confirm you're not a bot“)
          - yt-dlp, FFmpeg und Deno integriert, yt-dlp aktualisiert sich täglich selbst

          ### Installation
          1. DMG öffnen, MacYTDL in „Programme“ ziehen.
          2. Beim ersten Start: Systemeinstellungen › Datenschutz & Sicherheit › „Trotzdem öffnen“
             (oder \`xattr -dr com.apple.quarantine /Applications/MacYTDL.app\`). Die App ist ad-hoc signiert, nicht notarisiert.

          ### Enthaltene Komponenten
          \`\`\`
          $MANIFEST
          \`\`\`
          SHA-256: \`$(cut -d' ' -f1 dist/MacYTDL.dmg.sha256)\`
          NOTES
          gh release delete "$TAG" --cleanup-tag -y >/dev/null 2>&1 || true
          gh release create "$TAG" dist/MacYTDL.dmg --target "$GITHUB_SHA" --title "MacYTDL 2030 – $VERSION" \
            --notes-file notes.md --latest
          echo "DMG: https://github.com/${{ github.repository }}/releases/download/$TAG/MacYTDL.dmg"
